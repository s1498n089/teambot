[project]
name = "a2a-chatroom"
version = "0.1.0"
description = "A2A 多 agent 聊天室 — thin notification + pull 架構(FastAPI + poller + cursor 檔喚醒)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "pywinpty>=3.0.5",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "a2a-sdk>=1.1.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 需要真 server 子行程的考官測試(平時可 -m 'not slow' 跳過)"]
